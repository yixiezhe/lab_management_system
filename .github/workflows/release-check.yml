name: Release candidate checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: labops-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout sanitized candidate only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate disposable CI configuration
        run: python3 scripts/ci_demo_environment.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend and frontend
        run: docker compose build backend frontend

      - name: Start disposable database and demo
        id: start
        run: |
          docker compose up -d mysql backend frontend
          curl --fail --silent --show-error --retry 30 --retry-all-errors \
            --retry-delay 3 --retry-max-time 180 --max-time 10 \
            --output /dev/null http://127.0.0.1:8000/admin/login/
          curl --fail --silent --show-error --max-time 10 \
            --output /dev/null http://127.0.0.1:5173/

      - name: Django configuration and migration consistency
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py makemigrations --check --dry-run

      - name: Run existing Django tests
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: docker compose exec -T backend python manage.py test --noinput

      - name: Seed synthetic demo and verify authenticated APIs
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          docker compose run --rm --no-deps -T \
            -v "$GITHUB_WORKSPACE/database:/demo:ro" backend \
            python manage.py seed_local_labops --fixture /demo/demo_seed.json
          python3 scripts/ci_smoke.py

      - name: Show disposable service diagnostics on failure
        if: ${{ failure() }}
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100 backend frontend

      - name: Remove this run's disposable resources
        if: ${{ always() }}
        run: |
          test "$COMPOSE_PROJECT_NAME" = "labops-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          docker compose down --volumes --remove-orphans
